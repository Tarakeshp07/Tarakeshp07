name: Update profile stats

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # run it by hand from the Actions tab

permissions:
  contents: write            # lets the job commit the updated cards

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate stat cards
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          EXCLUDE_LANGUAGES: "Jupyter Notebook"
        run: python3 scripts/generate_stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update profile stats"
          git push
