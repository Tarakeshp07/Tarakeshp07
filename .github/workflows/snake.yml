name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # every day at 05:30 IST
  workflow_dispatch:       # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#38BDAC&color_dots=#ebedf0,#b2ebe5,#6fd3c6,#38BDAC,#1f7a70
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#38BDAC&color_dots=#161b22,#0e4f48,#16766b,#1f9e8f,#38BDAC

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
