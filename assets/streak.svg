<svg xmlns="http://www.w3.org/2000/svg" width="980" height="200" viewBox="0 0 980 200" role="img">
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .title { font-size: 20px; font-weight: 600; fill: #38BDAC; }
    .label { font-size: 14px; font-weight: 600; fill: #c9d1d9; }
    .value { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .small { font-size: 12px; fill: #c9d1d9; }
    .muted { font-size: 12px; fill: #8b949e; }
    .big   { font-size: 30px; font-weight: 700; fill: #ffffff; }
    .fade  { opacity: 0; animation: fade 0.6s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
  </style>
  <rect x="0.5" y="0.5" width="979" height="199" rx="10" fill="#0d1117" stroke="#30363d"/>
  <line x1="325" y1="35" x2="325" y2="175" stroke="#30363d"/>
  <line x1="655" y1="35" x2="655" y2="175" stroke="#30363d"/>
  <g class="fade"><text x="160" y="95" class="big" text-anchor="middle">2,083</text><text x="160" y="128" class="label" text-anchor="middle">Total Contributions</text><text x="160" y="152" class="muted" text-anchor="middle">Mar 18, 2024 - Present</text></g>
  <g class="fade" style="animation-delay:0.15s"><circle cx="490" cy="80" r="40" fill="none" stroke="#38BDAC" stroke-width="5"/><text x="490" y="91" class="big" text-anchor="middle">4</text><text x="490" y="145" class="label" text-anchor="middle" style="fill:#38BDAC">Current Streak</text><text x="490" y="168" class="muted" text-anchor="middle">Oct 12 - Oct 15</text></g>
  <g class="fade" style="animation-delay:0.3s"><text x="820" y="95" class="big" text-anchor="middle">14</text><text x="820" y="128" class="label" text-anchor="middle">Longest Streak</text><text x="820" y="152" class="muted" text-anchor="middle">Jan 9 - Jan 22</text></g>
</svg>
